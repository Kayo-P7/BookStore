services:
  postgres:

    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: bookstore
      RABBITMQ_DEFAULT_PASS: bookstore123
    ports:
      - "5672:5672"
      - "15672:15672"
  catalog-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: catalog-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      CATALOG_SERVICE_PORT: ${CATALOG_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${CATALOG_SERVICE_PORT}:${CATALOG_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  customer-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: customer-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      CUSTOMER_SERVICE_PORT: ${CUSTOMER_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${CUSTOMER_SERVICE_PORT}:${CUSTOMER_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy

  sales-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: sales-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SALES_SERVICE_PORT: ${SALES_SERVICE_PORT}
      CATALOG_URL: ${CATALOG_URL}
      CUSTOMER_URL: ${CUSTOMER_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${SALES_SERVICE_PORT}:${SALES_SERVICE_PORT}"
    depends_on:
      - catalog-service
      - customer-service

  loan-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: loan-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      LOAN_SERVICE_PORT: ${LOAN_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: bookstore
      SPRING_RABBITMQ_PASSWORD: bookstore123
    ports:
      - "${LOAN_SERVICE_PORT}:${LOAN_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - catalog-service
      - customer-service
      - sales-service
      - loan-service

  react-frontend:
    build: ./frontend/frontend-react
    ports:
      - "${REACT_PORT}:5173"
    environment:
      - GATEWAY_URL=${GATEWAY_URL}
      - REACT_PORT=${REACT_PORT}
    volumes:
      - ./frontend/frontend-react:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - gateway

  vue-frontend:
    build: ./frontend/frontend-vue
    ports:
      - "${VUE_PORT}:5174"
    environment:
      - GATEWAY_URL=${GATEWAY_URL}
      - VUE_PORT=${VUE_PORT}
    depends_on:
      - gateway

volumes:
  postgres_data:
