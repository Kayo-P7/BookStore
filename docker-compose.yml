
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    ports: ["5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build: {context: ., dockerfile: Dockerfile.service, args: {MODULE: catalog-service}}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookstore
      SPRING_DATASOURCE_USERNAME: bookstore
      SPRING_DATASOURCE_PASSWORD: bookstore
    depends_on: {postgres: {condition: service_healthy}}

  customer-service:
    build: {context: ., dockerfile: Dockerfile.service, args: {MODULE: customer-service}}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookstore
      SPRING_DATASOURCE_USERNAME: bookstore
      SPRING_DATASOURCE_PASSWORD: bookstore
    depends_on: {postgres: {condition: service_healthy}}

  sales-service:
    build: {context: ., dockerfile: Dockerfile.service, args: {MODULE: sales-service}}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookstore
      SPRING_DATASOURCE_USERNAME: bookstore
      SPRING_DATASOURCE_PASSWORD: bookstore
      CATALOG_URL: http://catalog-service:8081
      CUSTOMER_URL: http://customer-service:8082
    depends_on: [catalog-service, customer-service]

  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./gateway/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [catalog-service, customer-service, sales-service]

  react-frontend:
    build: ./frontend-react
    ports: ["5175:5173"]
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on: [gateway]

  vue-frontend:
    build: ./frontend-vue
    ports: ["5174:5174"]
    depends_on: [gateway]

volumes:
  postgres_data:
