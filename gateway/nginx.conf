worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/graphql-response+json
        application/javascript
        text/css
        text/plain
        text/xml;

    upstream catalog_backend {
        server catalog-service:8081;
        keepalive 32;
    }

    upstream customer_backend {
        server customer-service:8082;
        keepalive 32;
    }

    upstream sales_backend {
        server sales-service:8083;
        keepalive 32;
    }

    upstream loan_backend {
        server loan-service:8085;
        keepalive 32;
    }

    server {
        listen 80;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Autenticação
        location = /api/auth {
            proxy_pass http://customer_backend/api/auth;
        }

        location /api/auth/ {
            proxy_pass http://customer_backend/api/auth/;
        }

        # Catálogo
        location /api/catalog/ {
            proxy_pass http://catalog_backend/api/catalog/;
        }

        location /api/integrations/ {
            proxy_pass http://catalog_backend/api/integrations/;
        }

        location /graphql {
            proxy_pass http://catalog_backend/graphql;
        }

        # Clientes
        location = /api/customers {
            proxy_pass http://customer_backend/api/customers;
        }

        location /api/customers/ {
            proxy_pass http://customer_backend/api/customers/;
        }

        # Usuários
        location = /api/users {
            proxy_pass http://customer_backend/api/users;
        }

        location /api/users/ {
            proxy_pass http://customer_backend/api/users/;
        }

        # Vendas
        location = /api/sales {
            proxy_pass http://sales_backend/api/sales;
        }

        location /api/sales/ {
            proxy_pass http://sales_backend/api/sales/;
        }

        # Empréstimos
        location = /api/loans {
            proxy_pass http://loan_backend/api/loans;
        }

        location /api/loans/ {
            proxy_pass http://loan_backend/api/loans/;
        }

        # Saúde do Gateway
        location /actuator/health {
            return 200 'gateway UP';
            add_header Content-Type text/plain;
        }
    }
}
