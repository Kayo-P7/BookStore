events {}

http {
    server {
        listen 80;

        location /api/catalog/ {
            proxy_pass http://catalog-service:8081/api/catalog/;
        }

        location /api/integrations/ {
            proxy_pass http://catalog-service:8081/api/integrations/;
        }

        location /graphql {
            proxy_pass http://catalog-service:8081/graphql;
            proxy_set_header Host $host;
        }

        location = /api/customers {
            proxy_pass http://customer-service:8082/api/customers;
        }

        location /api/customers/ {
            proxy_pass http://customer-service:8082/api/customers/;
        }

        location = /api/sales {
            proxy_pass http://sales-service:8083/api/sales;
        }

        location /api/sales/ {
            proxy_pass http://sales-service:8083/api/sales/;
        }

        location /actuator/health {
            return 200 'gateway UP';
            add_header Content-Type text/plain;
        }
    }
}
