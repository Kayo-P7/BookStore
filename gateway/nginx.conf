
events {}

http {
    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Autenticação
        location = /api/auth {
            proxy_pass http://customer-service:8082/api/auth;
        }

        location /api/auth/ {
            proxy_pass http://customer-service:8082/api/auth/;
        }

        # Catálogo
        location /api/catalog/ {
            proxy_pass http://catalog-service:8081/api/catalog/;
        }

        location /api/integrations/ {
            proxy_pass http://catalog-service:8081/api/integrations/;
        }

        location /graphql {
            proxy_pass http://catalog-service:8081/graphql;
        }

        # Clientes
        location = /api/customers {
            proxy_pass http://customer-service:8082/api/customers;
        }

        location /api/customers/ {
            proxy_pass http://customer-service:8082/api/customers/;
        }

        # Usuários
        location = /api/users {
            proxy_pass http://customer-service:8082/api/users;
        }

        location /api/users/ {
            proxy_pass http://customer-service:8082/api/users/;
        }

        # Vendas
        location = /api/sales {
            proxy_pass http://sales-service:8083/api/sales;
        }

        location /api/sales/ {
            proxy_pass http://sales-service:8083/api/sales/;
        }

        # Empréstimos
        location = /api/loans {
            proxy_pass http://loan-service:8085/api/loans;
        }

        location /api/loans/ {
            proxy_pass http://loan-service:8085/api/loans/;
        }

        # Saúde do Gateway
        location /actuator/health {
            return 200 'gateway UP';
            add_header Content-Type text/plain;
        }
    }
}
