name: Deploy Frontend React

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'frontend/frontend-react/**'
      - '.github/workflows/deploy-frontend-react.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar Frontend React
        env:
          VITE_VUE_URL: ${{ secrets.VITE_VUE_URL }}
        run: |
          cd frontend/frontend-react
          npm ci || npm install
          npm run build

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Enviar React e recarregar Nginx
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/bookstore/dist"
          rsync -avz --delete frontend/frontend-react/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/bookstore/dist/
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "systemctl reload nginx"
