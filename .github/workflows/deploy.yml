name: CI/CD BookStore Deploy

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # 1. Configurar Java e Compilar Backend
      - name: Configurar Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar microsservicos backend
        run: |
          mvn -B clean package -DskipTests -f backend/pom.xml

      # 2. Configurar Node e Compilar Frontends
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compilar Frontend React
        env:
          VITE_VUE_URL: ${{ secrets.VITE_VUE_URL }}
        run: |
          cd frontend/frontend-react
          npm ci || npm install
          npm run build

      - name: Compilar Frontend Vue
        run: |
          cd frontend/frontend-vue
          npm ci || npm install
          npm run build

      # 3. Configurar Conexao SSH com a VPS
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # 4. Transferir Arquivos para a VPS
      - name: Enviar JARs do Backend para a VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/bookstore/backend"
          scp backend/*/target/*-service-1.0.0.jar ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/bookstore/backend/

      - name: Enviar Frontend React para a VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/bookstore/dist"
          rsync -avz --delete frontend/frontend-react/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/bookstore/dist/

      - name: Enviar Frontend Vue para a VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /var/www/bookstore-vue/dist"
          rsync -avz --delete frontend/frontend-vue/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/bookstore-vue/dist/

      # 5. Reiniciar Servicos na VPS
      - name: Reiniciar servicos backend e recarregar Nginx
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            systemctl restart bookstore-catalog bookstore-customer bookstore-sales bookstore-loan
            systemctl reload nginx
          "
