name: Deploy Sales Service

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'backend/sales-service/**'
      - 'backend/security-common/**'
      - 'backend/pom.xml'
      - '.github/workflows/deploy-sales.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar sales-service
        run: mvn -B clean package -DskipTests -pl sales-service -am -f backend/pom.xml

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Enviar JAR e reiniciar servico
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /opt/bookstore/backend"
          scp backend/sales-service/target/sales-service-1.0.0.jar ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/bookstore/backend/
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "systemctl restart bookstore-sales"
