server:
  port: 8083
spring:
  application:
    name: sales-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
services:
  catalog-url: ${CATALOG_URL}
  customer-url: ${CUSTOMER_URL}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
